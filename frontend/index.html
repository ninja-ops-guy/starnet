<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="description" content="AeroTech Staff — a game you play with AI">
<meta name="application-name" content="AeroTech Staff">
<meta name="apple-mobile-web-app-title" content="AeroTech Staff">
<title>AEROTECH STAFF</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/brand/starnet-logo.png">
<link rel="apple-touch-icon" href="assets/brand/starnet-logo.png">
<style>
  /* === CRT boot screen === */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0a0a0a;color:#e8e4dc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  #boot-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;background:#0a0a0a;z-index:9999;transition:opacity .8s ease}
  #boot-screen.done{opacity:0;pointer-events:none}
  .crt-scanline{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:1}
  .crt-flicker{position:absolute;inset:0;background:rgba(18,16,12,.04);pointer-events:none;z-index:2;animation:flicker .12s infinite}
  @keyframes flicker{0%,100%{opacity:1}50%{opacity:.97}}
  .crt-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(212,168,75,.06) 0,transparent 60%);pointer-events:none;z-index:0}
  #boot-logo{width:96px;height:96px;opacity:0;animation:logoIn .6s .2s forwards;position:relative;z-index:3}
  @keyframes logoIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  #boot-text{font-size:1.6rem;font-weight:700;letter-spacing:.18em;color:#d4a84b;opacity:0;animation:textIn .5s .5s forwards;position:relative;z-index:3}
  @keyframes textIn{from{opacity:0;letter-spacing:.28em}to{opacity:1;letter-spacing:.18em}}
  #boot-status{font-size:.82rem;color:#7a756d;margin-top:.4rem;opacity:0;animation:statusIn .4s .9s forwards;position:relative;z-index:3}
  @keyframes statusIn{from{opacity:0}to{opacity:1}}
  .starnet-hint{font-size:.75rem;color:#4a4742;margin-top:1.2rem;opacity:0;animation:statusIn .4s 1.4s forwards;position:relative;z-index:3}
  #boot-bar{width:180px;height:2px;background:rgba(212,168,75,.15);border-radius:1px;margin-top:.6rem;overflow:hidden;position:relative;z-index:3;opacity:0;animation:statusIn .4s .7s forwards}
  #boot-bar-fill{height:100%;background:#d4a84b;width:0%;transition:width .3s ease}
</style>
</head>
<body>

<!-- Boot screen — shown while the sidecar starts and the app loads -->
<div id="boot-screen" role="status" aria-label="AeroTech Staff boot screen" aria-live="polite">
  <div class="crt-glow" aria-hidden="true"></div>
  <div class="crt-scanline" aria-hidden="true"></div>
  <div class="crt-flicker" aria-hidden="true"></div>
  <img id="boot-logo" src="assets/brand/starnet-logo.png" alt="AEROTECH STAFF" width="96" height="96">
  <div id="boot-text">◆ AEROTECH STAFF</div>
  <div id="boot-bar" aria-hidden="true"><div id="boot-bar-fill"></div></div>
  <div id="boot-status">AeroTech Staff boot screen</div>
  <div class="starnet-hint">v<!-- VERSION -->0.13.1<!-- /VERSION --></div>
</div>

<!-- The app mounts here once booted -->
<div id="app-root" style="display:none;height:100%"></div>

<script type="module" src="app/glass-boot.js" data-prov="starnet"></script>

<script>
  // Fast fade-out once boot signals completion (glass-boot.js calls this)
  window.__starnet_boot_done = function(){
    const b = document.getElementById('boot-screen');
    if(!b) return;
    b.classList.add('done');
    setTimeout(()=>{ b.style.display='none'; }, 900);
  };
  // Progress bar animation
  (function(){
    const fill = document.getElementById('boot-bar-fill');
    if(!fill) return;
    let w = 0;
    const iv = setInterval(()=>{
      w += Math.random()*12 + 4;
      if(w > 85){ w = 85; clearInterval(iv); }
      fill.style.width = w + '%';
    }, 180);
    window.__starnet_boot_progress = function(pct){
      clearInterval(iv);
      fill.style.width = Math.min(pct,100) + '%';
    };
  })();
</script>

</body>
</html>
