<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="30%" stop-color="#a0a0a0"/>
      <stop offset="60%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#707070"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&amp;display=swap');
      .wordmark {
        font-family: 'Chakra Petch', 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 72px;
        letter-spacing: 8px;
        fill: url(#steel);
      }
      .staff {
        font-family: 'Chakra Petch', 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 72px;
        letter-spacing: 8px;
        fill: #ffaa33;
        filter: url(#glow);
      }
      .divider {
        stroke: #ffaa33;
        stroke-width: 3;
        filter: url(#glow);
      }
    </style>
  </defs>
  
  <!-- Background hexagon watermark -->
  <polygon points="60,60 30,12 90,12" fill="none" stroke="#ffaa33" stroke-width="1" opacity="0.15"/>
  <polygon points="60,60 90,108 30,108" fill="none" stroke="#ffaa33" stroke-width="1" opacity="0.15"/>
  <polygon points="60,60 120,60 90,12" fill="none" stroke="#ffaa33" stroke-width="1" opacity="0.15"/>
  <polygon points="60,60 0,60 30,108" fill="none" stroke="#ffaa33" stroke-width="1" opacity="0.15"/>
  
  <!-- Text -->
  <text x="140" y="55" class="wordmark" text-anchor="start">AEROTECH</text>
  <line x1="140" y1="70" x2="620" y2="70" class="divider"/>
  <text x="140" y="105" class="staff" text-anchor="start">STAFF</text>
</svg>
